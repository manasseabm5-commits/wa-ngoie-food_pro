{% extends 'base.html' %}

{% block title %}Commander {{ produit.nom }} - Wa Ngoie{% endblock %}

{% block content %}
<style>
    :root {
        --wa-orange: #F59E0B;
        --wa-bg-light: #FFF9F0;
        --wa-text-dark: #1F2937;
    }

    body {
        background-color: #FDF3E7 !important;
    }

    .order-card {
        background: #ffffff;
        border-radius: 25px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.05);
        border: none;
    }

    .order-img-container {
        height: 100%;
        min-height: 300px;
        border-radius: 25px 0 0 25px;
        overflow: hidden;
    }

    .order-img-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .form-control {
        border-radius: 12px;
        padding: 0.75rem 1rem;
        border: 1px solid #E5E7EB;
        background-color: #F9FAFB;
    }

    .form-control:focus {
        border-color: var(--wa-orange);
        box-shadow: 0 0 0 0.25rem rgba(245, 158, 11, 0.25);
    }

    .btn-submit-order {
        background-color: var(--wa-orange);
        color: white;
        border: none;
        border-radius: 12px;
        transition: all 0.2s;
    }

    .btn-submit-order:hover {
        background-color: #D97706;
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 10px 15px rgba(245, 158, 11, 0.2);
    }

    @media (max-width: 768px) {
        .order-img-container {
            border-radius: 25px 25px 0 0;
            min-height: 250px;
        }
    }
</style>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-9 col-xl-8">
            <div class="card order-card overflow-hidden">
                <div class="row g-0">
                    
                    <!-- Image du produit -->
                    <div class="col-md-5">
                        <div class="order-img-container">
                            <img src="{{ url_for('static', filename=produit.image) }}" alt="{{ produit.nom }}">
                        </div>
                    </div>
                    
                    <!-- Formulaire de commande -->
                    <div class="col-md-7">
                        <div class="card-body p-4 p-md-5">
                            <h2 class="card-title fw-bold mb-2" style="color: var(--wa-text-dark);">{{ produit.nom }}</h2>
                            <p class="card-text text-muted mb-3 small" style="line-height: 1.6;">{{ produit.description }}</p>
                            
                            <div class="d-flex align-items-center mb-4">
                                <h4 class="fw-bold mb-0" style="color: var(--wa-orange);">{{ produit.prix }} FC</h4>
                            </div>

                            <form method="POST" action="{{ url_for('commande.commander', product_id=produit.id) }}">
                                <div class="mb-3">
                                    <label for="quantite" class="form-label fw-bold small text-secondary">Quantité</label>
                                    <input type="number" class="form-control" id="quantite" name="quantite" value="1" min="1" required>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="telephone" class="form-label fw-bold small text-secondary">Numéro de téléphone</label>
                                    <input type="text" class="form-control" id="telephone" name="telephone" placeholder="Ex: 0812345678" required>
                                </div>
                                
                                <div class="mb-4">
                                    <label for="adresse" class="form-label fw-bold small text-secondary">Adresse de livraison (ou 'Sur place')</label>
                                    <input type="text" class="form-control" id="adresse" name="adresse" value="Sur place" required>
                                </div>
                                
                                <button type="submit" class="btn btn-submit-order w-100 py-3 fw-bold text-uppercase" style="letter-spacing: 1px;">
                                    <i class="fas fa-check-circle me-2"></i> Confirmer la commande
                                </button>
                            </form>
                            
                        </div>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
