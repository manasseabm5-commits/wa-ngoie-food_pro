{% extends "base.html" %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-4 p-4">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-right-to-bracket fa-3x text-warning mb-2"></i>
                    <h2 class="fw-bold">Connexion</h2>
                    <p class="text-muted">Accédez à votre espace Wa Ngoie</p>
                </div>
                
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Adresse Email</label>
                        <input type="email" name="email" class="form-control" required placeholder="nom@exemple.com">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Mot de passe</label>
                        <input type="password" name="password" class="form-control" required placeholder="••••••••">
                    </div>

                    <button type="submit" class="btn btn-warning w-100 py-3 fw-bold rounded-pill shadow-sm">
                        SE CONNECTER
                    </button>
                </form>

                <div class="text-center mt-4">
                    <p class="text-muted">Pas encore de compte ? <a href="{{ url_for('auth.register') }}" class="text-warning fw-bold text-decoration-none">Créer un compte</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
