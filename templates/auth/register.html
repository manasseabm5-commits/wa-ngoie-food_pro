{% extends 'base.html' %}

{% block title %}Inscription - Wa Ngoie{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0 rounded-3">
                <div class="card-body p-4">
                    <h2 class="text-center mb-2 text-warning fw-bold">Créer un Compte</h2>
                    <p class="text-center text-muted mb-4 fs-6">Rejoignez Wa Ngoie pour commander vos plats préférés</p>

                    <form method="POST" action="{{ url_for('auth.register') }}">
                        <div class="mb-3">
                            <label for="nom" class="form-label fw-bold">Nom complet</label>
                            <input type="text" class="form-control" id="nom" name="nom" placeholder="Ex: Manassé" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label fw-bold">Adresse Email</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="votre@email.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label fw-bold">Mot de passe</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-warning fw-bold py-2 fs-5">S'inscrire</button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <p class="mb-0">Déjà un compte ? <a href="{{ url_for('auth.login') }}" class="text-warning fw-bold text-decoration-none">Se connecter</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
